[package]
name = "app"
version = "0.3.0"
description = "EasyTask: desktop task and workspace manager"
authors = ["Ivan Erricis"]
license = "MIT"
publish = false
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Same as productName, so the binary is EasyTask(.exe) everywhere (dev, release, installer, portable zip)
[[bin]]
name = "EasyTask"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.0", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2.0.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-store = "2.4.1"
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same major/minor as the one used by tauri-plugin-sql, so its Pool<Sqlite> type is shared.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[profile.release]
lto = true
opt-level = "s"
strip = true
panic = "abort"
codegen-units = 1
