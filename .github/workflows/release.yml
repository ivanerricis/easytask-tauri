name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Two releases for the same ref must not interleave (they would race on the draft release)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # workflow_dispatch can start this workflow from a branch: releases are only made from version tags
      - name: Require a version tag (vX.Y.Z)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::The release workflow only runs for tags like v1.2.3 (ref: $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check that the versions and the tag agree
        run: node scripts/check-versions.mjs
      - run: npx eslint .
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - run: cargo clippy -- -D warnings
        working-directory: src-tauri
      - run: cargo test
        working-directory: src-tauri
      # Release notes = the section of this version of CHANGELOG.md (English) and of CHANGELOG.it.md (Italian), under
      # "## English" and "## Italiano": the app shows the one in the language of the user (src/lib/release-notes.ts).
      # Empty when CHANGELOG.md has none: the release job then falls back to the notes generated by GitHub.
      - name: Extract the release notes from the changelogs
        id: notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          section() {
            awk -v version="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "## [" version "]") == 1) { found = 1; next } }
              found { print }
            ' "$1" | sed -e '/./,$!d' | sed -e ':a' -e '/^\n*$/{$d;N;ba' -e '}'
          }
          EN=$(section CHANGELOG.md)
          IT=$(section CHANGELOG.it.md)
          NOTES=""
          if [ -z "$EN" ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION, using the generated release notes"
          elif [ -z "$IT" ]; then
            echo "::error::CHANGELOG.it.md has no section for $VERSION: the release notes need both languages"
            exit 1
          else
            NOTES=$(printf '## English\n\n%s\n\n## Italiano\n\n%s\n' "$EN" "$IT")
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Builds the installers (NSIS on Windows, deb + AppImage on Linux), signs the updater artifacts and uploads
      # them, with latest.json (merged across the two jobs), to a DRAFT release. Nothing is published automatically.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EasyTask ${{ github.ref_name }}'
          releaseBody: ${{ needs.verify.outputs.notes }}
          generateReleaseNotes: ${{ needs.verify.outputs.notes == '' }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
      # The portable zip reuses the executable built here (one build only).
      - name: Keep the Windows executable for the portable job
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p portable-input
          # The Cargo binary is already named EasyTask (see [[bin]] in Cargo.toml)
          cp src-tauri/target/release/EasyTask.exe portable-input/EasyTask.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Windows'
        with:
          name: windows-exe
          path: portable-input/EasyTask.exe
          if-no-files-found: error

  # Portable zip: EasyTask.exe + portable.txt (switches the app to <exe folder>/data) + a short README.
  portable:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-exe
          path: portable-input
      - name: Build the portable zip
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          DIR="EasyTask_${VERSION}_x64_portable"
          mkdir -p "$DIR"
          cp portable-input/EasyTask.exe "$DIR/EasyTask.exe"
          cp .github/portable/portable.txt "$DIR/portable.txt"
          cp .github/portable/LEGGIMI.txt "$DIR/LEGGIMI.txt"
          7z a -tzip "$DIR.zip" "./$DIR/*"
          echo "ZIP=$DIR.zip" >> "$GITHUB_ENV"
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$ZIP" --clobber --repo "${{ github.repository }}"
