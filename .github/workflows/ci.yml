name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json must carry the same version
  versions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/check-versions.mjs

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -b
      - run: npm test
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - run: npm run build

  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # tauri.conf.json frontendDist points to ../dist
      - name: Build frontend
        working-directory: .
        run: |
          npm ci
          npm run build
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Blocking for high/critical advisories (npm) and for any RustSec advisory, license or ban violation (cargo).
  # Known/accepted advisories are listed, with a reason, in src-tauri/.cargo/audit.toml and src-tauri/deny.toml.
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny check

  # End-to-end tests (WebdriverIO + tauri-driver, see e2e/wdio.conf.ts).
  # continue-on-error: the suite is new and not yet proven stable on the runners; it reports but does not block.
  # Remove `continue-on-error` once it has been green for a while.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      # The WebView2 driver (msedgedriver) matching the installed Edge is downloaded by e2e/wdio.conf.ts on Windows.
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - name: Build the debug app (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle
      # Starts the app by hand for 15 s and prints versions, exit code and the app log (see e2e/windows-diagnostics.ps1)
      - name: Diagnostics (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./e2e/windows-diagnostics.ps1
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        env:
          E2E_SKIP_BUILD: "1"
          E2E_DRIVER_LOG: "1"
        run: npm run e2e
      - name: Upload e2e logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output-${{ matrix.os }}
          path: e2e/output
          if-no-files-found: ignore
