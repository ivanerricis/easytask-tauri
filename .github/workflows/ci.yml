name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run: only the audit job (new advisories show up without any code change)
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      e2e_edge_args:
        description: "Extra WebView2 browser arguments for the Windows e2e run (e.g. --no-sandbox)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json must carry the same version
  versions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: node scripts/check-versions.mjs

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx eslint .
      - run: npx tsc -b
      - run: npm run e2e:typecheck
      # Runs the whole suite with coverage (no separate `npm test`)
      - run: npm run test:coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      - run: npm run build

  backend:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      # tauri.conf.json frontendDist points to ../dist
      - name: Build frontend
        working-directory: .
        run: |
          npm ci
          npm run build
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Also runs on the weekly schedule. Blocking for high/critical advisories (npm) and for any RustSec advisory, license or ban violation (cargo).
  # Known/accepted advisories are listed, with a reason, in src-tauri/.cargo/audit.toml and src-tauri/deny.toml.
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny check

  # End-to-end tests (WebdriverIO + tauri-driver, see e2e/wdio.conf.ts).
  # continue-on-error: the suite is new and not yet proven stable on the runners; it reports but does not block.
  # Remove `continue-on-error` once it has been green for a while.
  e2e:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      # The Windows run needs a manual start: on the hosted runner msedgedriver cannot attach to the app (the same
      # suite passes on a Windows machine), so it would only add a red job to every pull request
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            webkit2gtk-driver xvfb
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: npm ci
      # The WebView2 driver (msedgedriver) matching the installed Edge is downloaded by e2e/wdio.conf.ts on Windows.
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run e2e
      - name: Build the debug app (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle
      # Starts the app by hand for 15 s and prints versions, exit code and the app log (see e2e/windows-diagnostics.ps1)
      - name: Diagnostics (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./e2e/windows-diagnostics.ps1
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        env:
          E2E_SKIP_BUILD: "1"
          E2E_DRIVER_LOG: "1"
          E2E_EDGE_ARGS: ${{ inputs.e2e_edge_args }}
        run: npm run e2e
      # Where did the browser write DevToolsActivePort, and with which arguments was the app launched?
      - name: Diagnostics after the run (Windows)
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: pwsh
        env:
          E2E_EDGE_ARGS: ${{ inputs.e2e_edge_args }}
        run: ./e2e/windows-after-diagnostics.ps1
      - name: Upload e2e logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-output-${{ matrix.os }}
          path: e2e/output
          if-no-files-found: ignore
