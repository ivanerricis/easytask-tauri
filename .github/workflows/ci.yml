name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly run: only the audit job (new advisories show up without any code change)
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      e2e_edge_args:
        description: "Extra WebView2 browser arguments for the Windows e2e run (e.g. --no-sandbox)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # package.json, src-tauri/Cargo.toml and src-tauri/tauri.conf.json must carry the same version
  versions:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/check-versions.mjs

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - run: npm run lint
      # `npm run build` below runs `tsc -b` before vite
      - run: npm run e2e:typecheck
      # Runs the whole suite with coverage (no separate `npm test`)
      - run: npm run test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
      # Feeds the coverage badge in the README. Never fails the build (no token on fork PRs, Codecov outages)
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/clover.xml
          fail_ci_if_error: false
      - run: npm run build

  backend:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: ./.github/actions/linux-tauri-deps
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      # tauri.conf.json frontendDist points to ../dist
      - name: Build frontend
        working-directory: .
        run: npm run build
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Also runs on the weekly schedule. Blocking for high/critical advisories (npm) and for any RustSec advisory, license or ban violation (cargo).
  # Known/accepted advisories are listed, with a reason, in src-tauri/.cargo/audit.toml and src-tauri/deny.toml.
  audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-deps
      - name: npm audit (production dependencies, high and critical)
        run: npm audit --omit=dev --audit-level=high
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: cargo deny (advisories, licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny check

  # End-to-end tests (WebdriverIO + tauri-driver, see e2e/wdio.conf.ts).
  # continue-on-error: the suite is new and not yet proven stable on the runners; it reports but does not block.
  # Remove `continue-on-error` once it has been green for a while.
  e2e:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      # The Windows run needs a manual start: on the hosted runner msedgedriver cannot attach to the app (the same
      # suite passes on a Windows machine), so it would only add a red job to every pull request
      matrix:
        os: ${{ github.event_name == 'workflow_dispatch' && fromJSON('["ubuntu-24.04", "windows-latest"]') || fromJSON('["ubuntu-24.04"]') }}
        # The specs run one after the other (each launches the real app), so the Linux suite is split in 3 runners
        shard: ["1/3", "2/3", "3/3"]
        exclude:
          - os: windows-latest
            shard: "2/3"
          - os: windows-latest
            shard: "3/3"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: ./.github/actions/linux-tauri-deps
        with:
          extra-packages: webkit2gtk-driver xvfb
      # Restoring the .deb cache does not run the dpkg triggers: without them the app aborts at start
      # ("GLib-GIO-ERROR: Settings schema 'org.gnome.system.proxy' is not installed")
      - name: Run the dpkg triggers of the cached packages
        if: runner.os == 'Linux'
        run: |
          sudo glib-compile-schemas /usr/share/glib-2.0/schemas
          sudo gio-querymodules /usr/lib/x86_64-linux-gnu/gio/modules
          sudo /usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/gdk-pixbuf-query-loaders --update-cache
      - uses: ./.github/actions/setup-node-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      # The WebView2 driver (msedgedriver) matching the installed Edge is downloaded by e2e/wdio.conf.ts on Windows.
      - name: Run e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          E2E_SHARD: ${{ matrix.shard }}
        # dbus-run-session: without a session bus every app start waited ~30 s (a D-Bus timeout) before the window opened
        run: xvfb-run --auto-servernum dbus-run-session -- npm run e2e
      - name: Build the debug app (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --debug --no-bundle
      # Starts the app by hand for 15 s and prints versions, exit code and the app log (see e2e/windows-diagnostics.ps1)
      - name: Diagnostics (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./e2e/windows-diagnostics.ps1
      - name: Run e2e (Windows)
        if: runner.os == 'Windows'
        env:
          E2E_SKIP_BUILD: "1"
          E2E_DRIVER_LOG: "1"
          E2E_EDGE_ARGS: ${{ inputs.e2e_edge_args }}
        run: npm run e2e
      # Where did the browser write DevToolsActivePort, and with which arguments was the app launched?
      - name: Diagnostics after the run (Windows)
        if: runner.os == 'Windows' && always()
        continue-on-error: true
        shell: pwsh
        env:
          E2E_EDGE_ARGS: ${{ inputs.e2e_edge_args }}
        run: ./e2e/windows-after-diagnostics.ps1
      - name: Upload e2e logs and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-output-${{ matrix.os }}-${{ strategy.job-index }}
          path: e2e/output
          if-no-files-found: ignore
